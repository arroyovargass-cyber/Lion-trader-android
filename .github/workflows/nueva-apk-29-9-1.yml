name: Nueva APK29.9.1 - leon dorado
'on':
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/nueva-apk-29-9-1.yml
    - .github/workflows/lion-logo.png
permissions:
  contents: write
concurrency:
  group: lion-android-2991-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Preparar Android29.9.1
      run: "python3 - <<'PY'\nimport base64, hashlib, json\nfrom pathlib import Path\npayload=json.loads('{\"MainActivity.java\": \"\"\
        , \"NavigationPolicy.java\": \"\"\
        , \"AndroidManifest.xml\": \"\"\
        , \"build.gradle\": \"\"\
        , \"operations.html\": \"\"\
        , \"smoke_launch.py\": \"\"\
        , \"proyecto/tests/android-navigation.test.mjs\": \"\"\
        , \"proyecto/tests/android-gold.test.mjs\": \"\"\
        , \"proyecto/tests/NavigationPolicyTest.java\": \"\"\
        , \"proyecto/tests/android-ui-harness.mjs\": \"\"\
        }')\nexpected=json.loads('{\"MainActivity.java\": [\"53ccaccff3ef8a25f1062ccde5d1dbc2368c503d\", \"045e03945947d440c347e69117a33a7710b60f0f\"\
        ], \"AndroidManifest.xml\": [\"d23f45c9db4ea375f36f908f444a0c8663cd11de\", \"5a4d51af44d1c557b5d61ecc07c4dfdaff3be25b\"], \"build.gradle\"\
        : [\"d992de8e4d94a701e92862d830e429446f5e26ba\", \"7f516a29cc5a78aefbf4725b5aaf1228e4e19ff4\"], \"operations.html\": [\"eeaf967d7ef885ba46135b8b76c5f4951540d5eb\"\
        , \"7c4a95f3ac0e2fa696564dbf0b9f811b608f4c68\"], \"NavigationPolicy.java\": [\"0797ab0c85cdc74cd941e940ec36f5bec61203b1\"]}')\nlogo=Path('.github/workflows/lion-logo.png')\n\
        assert logo.is_file(), 'Falta lion-logo.png: subirlo junto al YAML en .github/workflows'\nassert hashlib.sha256(logo.read_bytes()).hexdigest()=='03f6c3e38f2ea4cac755cd45b3509a97a669eba0960d1f4b4896f4b25500d5f7',\
        \ 'El logo no coincide con el revisado'\ndef blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()\n\
        for name, original in expected.items():\n    p=Path(name)\n    desired=base64.b64decode(payload[name])\n    assert p.is_file() and blob(p.read_bytes())\
        \ in (*original,blob(desired)), 'Fuente cambiada: '+name\nfor name, encoded in payload.items():\n    p=Path(name); p.parent.mkdir(parents=True,exist_ok=True)\n\
        \    p.write_bytes(base64.b64decode(encoded))\nprint('Fuentes revisadas Android29.9.1 preparadas; Worker y D1 sin cambios.')\nPY\n"
    - name: Organizar proyecto
      run: 'lion_project=proyecto

        mkdir -p "$lion_project"/{gradle/wrapper,android/{src/com/liontrader/android,res/{drawable,values},assets}}

        cp settings.gradle gradle.properties gradlew gradlew.bat "$lion_project/"

        cp gradle-wrapper.jar gradle-wrapper.properties "$lion_project/gradle/wrapper/"

        cp build.gradle AndroidManifest.xml "$lion_project/android/"

        cp MainActivity.java NavigationPolicy.java "$lion_project/android/src/com/liontrader/android/"

        cp styles.xml "$lion_project/android/res/values/"

        cp ic_lion.xml "$lion_project/android/res/drawable/"

        cp operations.html "$lion_project/android/assets/"

        cp .github/workflows/lion-logo.png "$lion_project/android/assets/lion-logo.png"

        cp .github/workflows/lion-logo.png "$lion_project/android/res/drawable/lion_logo.png"

        printf "plugins { id ''com.android.application'' version ''8.9.2'' apply false }\n" > "$lion_project/build.gradle"

        '
    - name: Probar interfaz y protecciones
      working-directory: proyecto
      run: node --test --test-isolation=none tests/android-*.test.mjs
    - name: Probar politica HTTPS del logo
      working-directory: proyecto
      run: 'java com.sun.tools.javac.Main -d policy-test-classes android/src/com/liontrader/android/NavigationPolicy.java tests/NavigationPolicyTest.java

        java -cp policy-test-classes NavigationPolicyTest'
    - name: Compilar APK
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-35'' ''build-tools;35.0.0''

        cd proyecto

        chmod +x gradlew

        ./gradlew --no-daemon --console=plain :app:verificarApkDebug 2>&1 | tee compilacion.log

        '
    - name: Preparar emulador
      run: sudo chmod 666 /dev/kvm
    - name: Abrir y recorrer cuatro pestanas
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: python3 smoke_launch.py proyecto/android/build/outputs/apk/debug/app-debug.apk
    - name: Verificar identidad y firma
      run: "lion_apk=proyecto/android/build/outputs/apk/debug/app-debug.apk\n\"$ANDROID_HOME/build-tools/35.0.0/apksigner\" verify --verbose --print-certs\
        \ \"$lion_apk\" > salida/FIRMA.txt\n\"$ANDROID_HOME/build-tools/35.0.0/aapt2\" dump badging \"$lion_apk\" > salida/FICHA_APK.txt\npython3\
        \ - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,re,zipfile\np=Path('proyecto/android/build/outputs/apk/debug/app-debug.apk')\n\
        badge=Path('salida/FICHA_APK.txt').read_text()\nassert \"name='com.liontrader.android'\" in badge and \"versionCode='29901'\" in badge\
        \ and \"versionName='29.9.1'\" in badge\nassert re.search(r\"(?:minSdkVersion|sdkVersion):'26'\",badge) and \"targetSdkVersion:'35'\"\
        \ in badge\nwith zipfile.ZipFile(p) as z:\n    assert z.read('assets/operations.html')==Path('operations.html').read_bytes()\n    assert\
        \ z.read('assets/lion-logo.png')==Path('.github/workflows/lion-logo.png').read_bytes()\n    assert 'classes.dex' in z.namelist()\n   \
        \ assert not any(n.endswith(('.jks','.keystore','.p12','.pem')) for n in z.namelist())\ndigest=hashlib.sha256(p.read_bytes()).hexdigest()\n\
        Path('salida/SHA256.txt').write_text(digest+'  LION_TRADER_29_9_1_PRUEBA.apk\\n')\nPath('salida/VERIFICACION.json').write_text(json.dumps({'version':'29.9.1','version_code':29901,'sha256':digest,'bytes':p.stat().st_size,'offline_android_navigation_tested':True,'worker_changed':False,'d1_changed':False,'signing_type':'debug','uninstall_previous_required':True},indent=2)+'\\\
        n')\nPY\ncp \"$lion_apk\" salida/LION_TRADER_29_9_1_PRUEBA.apk\n"
    - name: Guardar codigo en GitHub
      run: "git add MainActivity.java NavigationPolicy.java AndroidManifest.xml build.gradle operations.html\nif ! git diff --cached --quiet;\
        \ then\n  git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m \"Add four-tab Android app 29.9.1\"\
        \n  git push origin HEAD:main\nfi\n"
    - name: Descargar APK validada
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: LION_TRADER_29_9_1_VALIDADO
        path: salida/
        if-no-files-found: error
        retention-days: 14
    - name: Guardar evidencia si falla
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ERROR_ANDROID_29_9_1
        path: 'salida/*.png

          salida/*.xml

          salida/*.txt

          salida/*.json

          proyecto/compilacion.log'
        if-no-files-found: ignore
        retention-days: 7
